[package]
name = "music-api"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A self-hosted music player with a Rust streaming backend and Vue frontend"
publish = false

[dependencies]
aes = "0.8"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "ws"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = "0.4"
ctr = "0.9"
encoding_rs = "0.8"
flate2 = "1"
futures = "0.3"
lazy_static = "1.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.7"
mime_guess = "2"
oxideav-mp4 = "0.0.8"
prost = "0.13"
protobuf = "3.5"
rand = "0.9"
regex = "1.10"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "multipart"] }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
roxmltree = "0.15"
rsa = "0.9.2"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql"] }
thiserror = "2"
temari = "=0.3.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
widevine = "0.1"
widevine-proto = "0.1"
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
argon2 = "0.5"
yrs = "0.28"
sha2 = "0.10"
dashmap = "6"
webauthn-rs-proto = "0.5"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"

[profile.release]
lto = true
panic = "abort"

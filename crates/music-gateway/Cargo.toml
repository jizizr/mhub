[package]
name = "music-gateway"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Contract and client for the MHub music source gateway"
publish = false

[features]
default = []
# The HTTP client used by gateway consumers such as the Telegram bot. MHub
# itself only needs the shared types.
client = ["dep:reqwest", "dep:serde_json", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util"] }
